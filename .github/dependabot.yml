version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    groups:
      styling:
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss*"
          - "daisyui"
      test-and-build-tooling:
        dependency-type: "development"
        patterns:
          - "@biomejs/*"
          - "@playwright/*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Brussels"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Brussels"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    commit-message:
      prefix: "infra"
