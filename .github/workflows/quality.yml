name: Quality and security

on:
  workflow_call:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Check formatting and lint without modifying files
        run: bunx --bun biome ci .

  verify:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run build.types

      - name: Unit tests and coverage
        run: bun run test.coverage

      - name: Production build
        run: bun run build

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Bounded with one retry: a stalled browser or apt download once held this step
      # for most of the job timeout.
      - name: Install supported browsers
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == "true" ]]; then
            install=(install-deps chromium firefox webkit)
          else
            install=(install --with-deps chromium firefox webkit)
          fi
          for attempt in 1 2; do
            if timeout --kill-after=15 300 bunx playwright "${install[@]}"; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed or timed out" >&2
          done
          exit 1

      - name: Cross-browser interaction tests
        run: bun run test.e2e
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_KEY: sb_publishable_ci_placeholder

      # Traces only cover the mock Supabase and placeholder keys; no secrets.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dependency audit
        run: bun audit --audit-level=high

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # make ci builds the static assets (frontend/build.mjs) before the Go
      # tests that check them.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      # Same gate as locally: assets and their committed manifest, the
      # generator tests, templ generate -check, go vet, staticcheck,
      # golangci-lint, gofmt, go test -race, govulncheck, gosec and the build.
      - name: Go quality gate
        run: make ci

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan committed history for unacknowledged secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build production container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: aestheticlab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime and application behavior
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_KEY: sb_publishable_ci_placeholder
          SMOKE_SKIP_DEPENDENCY: "true"
        run: |
          test "$(docker image inspect aestheticlab:ci --format '{{.Config.User}}')" = "65532:65532"
          container_id=$(docker create aestheticlab:ci)
          docker export "$container_id" --output /tmp/aestheticlab-ci.tar
          if tar --list --file=/tmp/aestheticlab-ci.tar | grep --extended-regexp '^app/node_modules/.*\.(node|so|dylib)$'; then
            echo "Native runtime dependency cannot be copied from BUILDPLATFORM into TARGETPLATFORM" >&2
            docker rm "$container_id" >/dev/null
            exit 1
          fi
          docker rm "$container_id" >/dev/null
          docker run --detach --rm --name aestheticlab-ci --publish 127.0.0.1:3000:3000 --env SUPABASE_URL --env SUPABASE_KEY aestheticlab:ci
          trap 'docker stop aestheticlab-ci >/dev/null 2>&1 || true' EXIT
          ./scripts/smoke-deployment.sh http://127.0.0.1:3000

      - name: Scan production container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: aestheticlab:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.2
          tofu_wrapper: false

      - name: Check formatting
        run: tofu -chdir=infra fmt -check -recursive

      - name: Initialize providers without backend
        run: tofu -chdir=infra init -backend=false -input=false

      - name: Validate configuration
        run: tofu -chdir=infra validate
