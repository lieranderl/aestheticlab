name: Quality and security

on:
  workflow_call:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Check formatting and lint without modifying files
        run: bunx --bun biome ci .

  verify:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # The browser specs build the assets and the binary first (make assets
      # go-build in playwright.config.ts).
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: bun ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # The runner's Ubuntu mirror can serve the browsers' 119 MB of packages
      # at tens of kB/s, past the install timeout. Keep the .deb files so apt
      # downloads only what changed; the runner image in the key refreshes
      # them weekly, and the restore keys bring back the last set to reuse.
      - name: Resolve runner image
        id: runner-image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore browser system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-ubuntu-24.04-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.runner-image.outputs.version }}
          restore-keys: |
            playwright-apt-ubuntu-24.04-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-
            playwright-apt-ubuntu-24.04-${{ runner.arch }}-

      # Let apt finish before retrying browser downloads: killing its unprivileged
      # parent can leave a root-owned apt-get running and holding the dpkg lock.
      # autoclean drops superseded versions before the packages are kept.
      - name: Install browser system dependencies
        timeout-minutes: 10
        run: |
          mkdir -p ~/.cache/playwright-apt
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages >/dev/null
          find ~/.cache/playwright-apt -maxdepth 1 -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +
          bunx playwright install-deps chromium firefox webkit
          sudo apt-get autoclean
          find ~/.cache/playwright-apt -maxdepth 1 -name '*.deb' -delete
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-apt/ {} +

      - name: Save browser system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Install supported browsers
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=15 300 bunx playwright install chromium firefox webkit; then
              exit 0
            fi
            echo "Playwright browser download attempt $attempt failed or timed out" >&2
          done
          exit 1

      - name: Cross-browser interaction tests
        run: make test-e2e

      # Traces only cover the embedded content snapshot; no secrets.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dependency audit
        run: bun audit --audit-level=high

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # make ci builds the static assets (frontend/build.mjs) before the Go
      # tests that check them.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      # Same gate as locally: assets and their committed manifest, the
      # generator tests, templ generate -check, go vet, staticcheck,
      # golangci-lint, gofmt, go test -race, govulncheck, gosec and the build.
      - name: Go quality gate
        run: make ci

      # The content store against Firestore's emulator as well as stand-ins
      # (make firestore, make test-content): import, export and fetch.
      - name: Content works with Firestore
        env:
          FIRESTORE_EMULATOR_IMAGE: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-emulators@sha256:8d8573471c489a409f03891d2c24d177fa531276184f7002b9a2d853d1b3ed54
        run: |
          set -o pipefail
          docker run -d --name firestore -p 8087:8087 "$FIRESTORE_EMULATOR_IMAGE" \
            gcloud emulators firestore start --host-port=0.0.0.0:8087
          trap 'docker rm -f firestore >/dev/null 2>&1 || true' EXIT
          timeout 120 bash -c 'until curl -fsS localhost:8087 >/dev/null; do sleep 1; done'
          FIRESTORE_EMULATOR_HOST=localhost:8087 go test -count=1 -race -v ./internal/content/ | tee content.log
          grep -q -- '--- PASS: TestFirestoreKeepsTheImportedContent' content.log

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan committed history for unacknowledged secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build production container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: aestheticlab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime, embedded assets and deployment smoke
        env:
          SMOKE_SKIP_DEPENDENCY: "true"
        run: |
          test "$(docker image inspect aestheticlab:ci --format '{{.Config.User}}')" = "65532:65532"
          docker run --detach --rm --name aestheticlab-ci --publish 127.0.0.1:3000:3000 aestheticlab:ci
          trap 'docker stop aestheticlab-ci >/dev/null 2>&1 || true' EXIT
          # No content database here: the site serves its embedded snapshot
          # and /dependencyz answers 503.
          DEPENDENCY_STATUS=503 bash ./scripts/smoke-go-container.sh http://127.0.0.1:3000
          ./scripts/smoke-deployment.sh http://127.0.0.1:3000

      - name: Scan production container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: aestheticlab:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.2
          tofu_wrapper: false

      - name: Check formatting
        run: tofu -chdir=infra fmt -check -recursive

      - name: Initialize providers without backend
        run: tofu -chdir=infra init -backend=false -input=false

      - name: Validate configuration
        run: tofu -chdir=infra validate
