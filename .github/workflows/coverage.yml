name: Coverage badge

# Measures Go test coverage on staging and publishes it as a shields.io
# endpoint file (coverage.json) on the unprotected badges branch, which the
# README badge reads. Generated code (*_templ.go, *_gen.go) is left out.

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-badge
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The asset tests check the built files the manifest names.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Build assets
        run: |
          bun ci
          make assets

      - name: Measure coverage
        id: coverage
        run: |
          go test -count=1 -coverprofile=cover.out ./...
          grep -v -E '_templ\.go:|_gen\.go:' cover.out > cover-handwritten.out
          percent=$(go tool cover -func=cover-handwritten.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          test -n "$percent"
          echo "percent=$percent" >> "$GITHUB_OUTPUT"
          echo "Go coverage (handwritten code): $percent%" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout badges branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges
          path: badges

      - name: Publish coverage.json
        env:
          PERCENT: ${{ steps.coverage.outputs.percent }}
        working-directory: badges
        run: |
          color=$(awk -v p="$PERCENT" 'BEGIN { print (p >= 80 ? "brightgreen" : p >= 60 ? "yellow" : "red") }')
          printf '{"schemaVersion":1,"label":"Go coverage","message":"%s%%","color":"%s","namedLogo":"go","logoColor":"white"}\n' "$PERCENT" "$color" > coverage.json
          if git diff --quiet -- coverage.json; then
            echo "Coverage unchanged at $PERCENT%"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage: $PERCENT% at ${GITHUB_SHA::7}"
          git push -q origin HEAD:badges
