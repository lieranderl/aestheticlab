# Air hot reload for the Go site (make go-dev): regenerates templ code and
# the static assets, then rebuilds cmd/web, on changes under cmd/, internal/,
# frontend/ and static/.
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/web"
  cmd = "go tool templ generate && bun run assets && go build -o ./tmp/web ./cmd/web"
  delay = 500
  exclude_dir = ["tmp", "bin", "node_modules", ".git", "static/dist", "frontend/generated"]
  exclude_regex = ["_test.go", ".*_templ.go", ".*_gen.go"]
  include_dir = ["cmd", "internal", "frontend", "static"]
  include_ext = ["go", "templ", "css", "js", "mjs", "svg"]
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
